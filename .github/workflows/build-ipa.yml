name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (Release, unsigned)
        run: |
          xcodebuild -project WeatherApp.xcodeproj \
            -scheme WeatherApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Ad-hoc sign & package IPA
        run: |
          APP=dd/Build/Products/Release-iphoneos/WeatherApp.app
          codesign --force --sign - --timestamp=none \
            "$APP/PlugIns/WeatherWidgetExtension.appex" 2>/dev/null || true
          codesign --force --sign - --timestamp=none "$APP" 2>/dev/null || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr WeatherApp-unsigned.ipa Payload
          ls -la WeatherApp-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherApp-ipa
          path: WeatherApp-unsigned.ipa
